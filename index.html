<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width", initial-scale="1.0">
    <title>語彙語彙数</title>
    <link rel="stylesheet" href="style.css">

    <meta name="google-site-verification" content="kKWDqUXwiOOpCLsfid_KRCaZeqKLCPU-2tuOhEJ1YyE" />
</head>
<body>

    <!--画面１：言語選択-->
    <div id="screen-language" class="screen">
        <div id="menu-container">
            <h1>言語</h1>

            <div id="list-language" class= "quiz-list"></div>
        </div>
    </div>

    <!-- 画面２：リスト選択 -->
    <div id="screen-list" class="screen" style="display:none;">
        <div id="menu-container">
            <div class="header-row">
                <a href="#" class="back-link" onclick="renderLanguageMenu(); return false;">戻る</a>
                <h1 id="list-title">リスト選択</h1>
            </div>
            <p id="list-subtitle">ここに説明</p>
            <div id="list-lists" class="quiz-list"></div>
        </div>
    </div>

    <!--画面３：出題モード選択-->
    <div id="screen-mode" class="screen" style="display:none;">
        <div id="menu-container">
            <div class="header-row">
                <a href="#" class="back-link" onclick="showScreen('screen-list'); return false;">戻る</a>
                <h1 id="mode-title">出題モード</h1>
            </div>
            <div class="quiz-list">
                <div class="quiz-card" onclick="chooseRandomMode()">
                    <span class="quiz-title">全体からランダム出題</span>
                    <span class="quiz-desc">1000語からランダムに出題</span>
                </div>
                <div class="quiz-card" onclick="chunkSelectMode = 'random'; renderChunkMenu(); showScreen('screen-chunk')">
                    <span class="quiz-title">範囲を選んでランダム</span>
                    <span class="quiz-desc">100問区切りでランダム</span>
                </div>
                <div class="quiz-card" onclick="chunkSelectMode = 'sequential'; renderChunkMenu(); showScreen('screen-chunk')">
                    <span class="quiz-title">100問ずつ</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 画面４：100問の範囲選択 -->
    <div id="screen-chunk" class="screen" style="display:none;">
        <div id="menu-container">
            <div class="header-row">
                <a href="#" class="back-link" onclick="showScreen('screen-mode'); return false;">戻る</a>
                <h1>範囲を選択</h1>
            </div>
            <div id="list-chunks" class="quiz-list"></div>
        </div>
    </div>

    <!-- 画面５：クイズ本体 -->
    <div id="screen-quiz" class="screen" style="display:none;">
        <div id="menu-container">
            <div class="header-row">
                <a href="#" class="back-link" onclick="showScreen('screen-list'); return false;">戻る</a>
            </div>
            <div id="quiz-container">
                <div id="question-area">
                    <h2 id="question-text">問題文がここに入る</h2>
                    <button id="speak-btn">🔊</button>
                </div>
                <div id="choices">
                    <button class="choice-btn"><span class="choice-number">1</span><span class="choice-text"></span></button>
                    <button class="choice-btn"><span class="choice-number">2</span><span class="choice-text"></span></button>
                    <button class="choice-btn"><span class="choice-number">3</span><span class="choice-text"></span></button>
                </div>
                <p id="result-text"></p>
                <button id="next-btn" class="disabled">次へ</button>
            </div>

            <!-- 終了画面 -->
            <div id="quiz-complete" style="display:none;">
                <div class="quiz-container">
                    <h2>お疲れさまでした！</h2>
                    <p id="complete-message"></p>
                    <button class="quiz-card" onclick="showScreen('screen-mode')" style="margin-top: 16px;">
                        <span class="quiz-title">出題モードに戻る</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- wordlistファイルを読み込む(contentより先) -->
    <script src="EN-Lists/wordlist-en-list1.js"></script>
    <script src="EN-Lists/wordlist-en-list2.js"></script>
    <script src="EN-Lists/wordlist-en-list3.js"></script>
    <script src="EN-Lists/wordlist-en-list4.js"></script>
    <script src="EN-Lists/wordlist-en-list5.js"></script>
    <script src="EN-Lists/wordlist-en-list6.js"></script>
    <script src="EN-Lists/wordlist-en-list7.js"></script>
    <script src="EN-Lists/wordlist-en-list8.js"></script>
    <script src="EN-Lists/wordlist-en-list9.js"></script>
    <script src="EN-Lists/wordlist-en-list10.js"></script>

    <script src="content.js"></script>
    <script src="script.js"></script>
</body>
</html>
