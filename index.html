<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>言語道場</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!--画面１：言語選択-->
    <div id="screen-language" class="screen">
        <div id="menu-container">
            <h1>言語を選択</h1>

            <div id="quiz-list">
                <div class="quiz-card" onclick="showScreen('screen-english-menu')">
                    <span class="quiz-title">英語</span>
                </div>

                <div class="quiz-card disabled">
                    <span class="quiz-title">スペイン語</span>
                </div>
            </div>
        </div>
    </div>

    <!--画面２：英語メニュー（難易度選択）-->
    <div id="screen-english-menu" class="screen" style="display:none;">
        <div id="menu-container">
            <a href="#" class="back-link" onclick="showScreen('screen-language'); return false;">言語選択へ戻る</a>

            <h1>難易度</h1>

            <div id="quiz-list">
                <div class="quiz-card disabled">
                    <span class="quiz-title">基礎単語</span>
                </div>

                <div class="quiz-card disabled">
                    <span class="quiz-title">初級単語</span>
                </div>

                <div class="quiz-card" onclick="startQuiz()">
                    <span class="quiz-title">中級単語</span>
                </div>

                <div class="quiz-card disabled">
                    <span class="quiz-title">上級単語</span>
                </div>
            </div>
        </div>
    </div>

    <!--画面３：クイズ本体-->
    <div id="screen-quiz" class="screen" style="display:none;">
        <div id="menu-container">
            <a href="#" class="back-link" onclick="showScreen('screen-english-menu'); return false;">難易度選択へ戻る</a>

            <div id="quiz-container">
                <div id="question-area">
                    <h2 id="question-text">問題文がここに入る</h2>
                    <button id="speak-btn">🔊</button>
                </div>

                <div id="choices">
                    <button class="choice-btn"><span class="choice-number">1</span><span class="choice-text"></span></button>
                    <button class="choice-btn"><span class="choice-number">2</span><span class="choice-text"></span></button>
                    <button class="choice-btn"><span class="choice-number">3</span><span class="choice-text"></span></button>
                </div>

                <p id="result-text"></p>

                <button id="next-btn" class="disabled">次へ</button>
            </div>
        </div>
    </div>

    <script src="wordlist.js"></script>
    <script src="script.js"></script>
</body>
</html>
