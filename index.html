<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>語彙語彙数 | 1万以上の英語・多言語の単語を学びクイズ感覚で語彙力を身につけよう</title>
    <meta name="description" content="英語や多数の言語が学べ、英単語は9,000単語以上！3択クイズで単語力、語彙力を伸ばせるサイト。範囲選択からランダム出題・音声読み上げにも対応。">
    <link rel="stylesheet" href="style.css">

    <meta name="google-site-verification" content="kKWDqUXwiOOpCLsfid_KRCaZeqKLCPU-2tuOhEJ1YyE" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-HC3RGPRW90"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-HC3RGPRW90');
    </script>
</head>
<body>

    <!-- 全画面共通：設定ボタン -->
    <button id="global-setting-btn" onclick="openSettingsModal()">⚙️ 設定</button>

    <!-- 設定モーダル（最前面にポップアップ表示） -->
    <div id="settings-modal" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <h2>音声設定</h2>

            <div class="setting-item">
                <label>
                    <input type="checkbox" id="setting-mute" onchange="updateSettings()">
                    ミュート
                </label>
            </div>

            <div class="setting-item">
                <label>
                    音量：<span id="volume-val">1.0</span>
                </label>
                <input type="range" id="setting-volume" min="0" max="1" step="0.1" value="1.0" oninput="updateSettings()">
            </div>

            <div class="setting-item">
                <label>読み上げ速度：<span id="rate-val">1.0</span></label>
                <input type="range" id="setting-rate" min="0.5" max="2.0" step="0.1" value="1.0" oninput="updateSettings()">
            </div>

            <button class="complete-btn primary" onclick="closeSettingsModal()" style="margin-top: 16px; width: 100%;">閉じる</button>
        </div>
    </div>

    <!--画面１：言語選択-->
    <div id="screen-language" class="screen">
        <div id="menu-container">
            <h1>言語</h1>
            <div id="list-language" class= "quiz-list"></div>
        </div>
    </div>

    <!-- 画面２：リスト選択 -->
    <div id="screen-list" class="screen" style="display:none;">
        <div id="menu-container">
            <div class="header-row">
                <a href="#" class="back-link" onclick="renderLanguageMenu(); return false;">戻る</a>
                <h1 id="list-title">リスト選択</h1>
            </div>
            <p id="list-subtitle">ここに説明</p>
            <div id="list-lists" class="quiz-list"></div>
        </div>
    </div>

    <!-- 画面2.5：形式選択 -->
    <div id="screen-format" class="screen" style="display:none;">
        <div id="menu-container">
            <div class="header-row">
                <a href="#" class="back-link" onclick="showScreen('screen-list'); return false;">戻る</a>
                <h1>形式を選択</h1>
            </div>
            <div class="quiz-list">
                <div class="quiz-card" onclick="currentFormat = 'quiz'; showScreen('screen-mode')">
                    <span class="quiz-title">3択クイズ</span>
                    <span class="quiz-desc">選択肢から意味を選ぶ</span>
                </div>
                <div class="quiz-card" onclick="currentFormat = 'card'; showScreen('screen-mode')">
                    <span class="quiz-title">単語帳</span>
                    <span class="quiz-desc">タップで意味を確認・進行</span>
                </div>
            </div>
        </div>
    </div>

    <!--画面３：出題モード選択-->
    <div id="screen-mode" class="screen" style="display:none;">
        <div id="menu-container">
            <div class="header-row">
                <a href="#" class="back-link" onclick="showScreen('screen-format'); return false;">戻る</a>
                <h1 id="mode-title">出題モード</h1>
            </div>
            <div class="quiz-list">
                <div class="quiz-card" onclick="chooseRandomMode()">
                    <span class="quiz-title">全体からランダム出題</span>
                    <span class="quiz-desc">1000語からランダムに出題</span>
                </div>
                <div class="quiz-card" onclick="chunkSelectMode = 'random'; renderChunkMenu(); showScreen('screen-chunk')">
                    <span class="quiz-title">範囲を選んでランダム</span>
                    <span class="quiz-desc">100問区切りでランダム</span>
                </div>
                <div class="quiz-card" onclick="chunkSelectMode = 'sequential'; renderChunkMenu(); showScreen('screen-chunk')">
                    <span class="quiz-title">100問ずつ</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 画面４：100問の範囲選択 -->
    <div id="screen-chunk" class="screen" style="display:none;">
        <div id="menu-container">
            <div class="header-row">
                <a href="#" class="back-link" onclick="showScreen('screen-mode'); return false;">戻る</a>
                <h1>範囲を選択</h1>
            </div>
            <div id="list-chunks" class="quiz-list"></div>
        </div>
    </div>

    <!-- 画面５：クイズ本体 -->
    <div id="screen-quiz" class="screen" style="display:none;">
        <div id="menu-container">
            <div class="header-row">
                <a href="#" class="back-link" onclick="handleQuizBack(); return false;">戻る</a>
            </div>

            <p id="quiz-info"></p>

            <div id="quiz-container">
                <div id="question-area">
                    <h2 id="question-text">問題文がここに入る</h2>
                    <button id="speak-btn">🔊</button>
                </div>
                <div id="choices">
                    <button class="choice-btn"><span class="choice-number">1</span><span class="choice-text"></span></button>
                    <button class="choice-btn"><span class="choice-number">2</span><span class="choice-text"></span></button>
                    <button class="choice-btn"><span class="choice-number">3</span><span class="choice-text"></span></button>
                </div>
                <p id="result-text"></p>
                <button id="next-btn" class="disabled">次へ</button>
            </div>

            <!-- 終了画面 -->
            <div id="quiz-complete" style="display:none;">
                <div class="quiz-container complete-box">
                    <h2>お疲れさまでした！</h2>
                    <p id="complete-message"></p>

                    <div id="wrong-answers-list"></div>
                    
                    <div class="complete-buttons">
                        <button class="complete-btn primary" onclick="retryQuiz()">もう一度</button>
                        <button class="complete-btn" onclick="showScreen('screen-mode')">範囲選択へ</button>
                        <button class="complete-btn" onclick="showScreen('screen-format')">形式選択へ</button>
                        <button class="complete-btn" onclick="renderLanguageMenu()">言語選択へ</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 画面６：単語帳 -->
    <div id="screen-card" class="screen" style="display:none;">
        <div id="menu-container">
            <div class="header-row">
                <a href="#" class="back-link" onclick="handleQuizBack(); return false;">戻る</a>
            </div>
            <p id="card-info"></p>

            <div id="card-area">
                <!-- タップ専用に変更 -->
                <div id="flashcard" onclick="onCardClicked()">
                    <div id="card-word-row">
                        <h2 id="card-word"></h2>
                        <button id="card-speak" onclick="event.stopPropagation(); if(currentCard) speakWord(currentCard.word);">🔊</button>
                    </div>
                    <p id="card-meaning"></p>
                    <p id="card-hint">👆 タップして意味を表示</p>
                </div>
                <p id="card-progress"></p>
            </div>

            <div id="card-complete" style="display:none;">
                <div class="quiz-container complete-box">
                    <h2>お疲れさまでした！</h2>
                    <p style="color: #666; margin-bottom: 20px;">すべての単語を確認しました！</p>
                    
                    <div class="complete-buttons">
                        <button class="complete-btn primary" onclick="retryQuiz()">もう一度</button>
                        <button class="complete-btn" onclick="showScreen('screen-mode')">範囲選択へ</button>
                        <button class="complete-btn" onclick="showScreen('screen-format')">形式選択へ</button>
                        <button class="complete-btn" onclick="renderLanguageMenu()">言語選択へ</button>
                    </div>                
                </div>
            </div>
        </div>
    </div>

    <!-- wordlistファイルを読み込む -->
    <script src="EN-Lists/wordlist-en-list1.js"></script>
    <script src="EN-Lists/wordlist-en-list2.js"></script>
    <script src="EN-Lists/wordlist-en-list3.js"></script>
    <script src="EN-Lists/wordlist-en-list4.js"></script>
    <script src="EN-Lists/wordlist-en-list5.js"></script>
    <script src="EN-Lists/wordlist-en-list6.js"></script>
    <script src="EN-Lists/wordlist-en-list7.js"></script>
    <script src="EN-Lists/wordlist-en-list8.js"></script>
    <script src="EN-Lists/wordlist-en-list9.js"></script>
    <script src="EN-Lists/wordlist-en-list10.js"></script>

    <script src="content.js"></script>
    <script src="script.js"></script>
</body>
</html>
